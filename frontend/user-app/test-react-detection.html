<!DOCTYPE html>
<html>
<head>
    <title>LEVER React App Detection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0b0d;
            color: #f5f5f7;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .pass { background: #1a4d33; border: 1px solid #4caf50; }
        .fail { background: #4d1a1a; border: 1px solid #f44336; }
        .warn { background: #4d3a1a; border: 1px solid #ff9800; }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 LEVER React App Detection Test</h1>

    <div id="tests">
        <div class="test-result">⏳ Running tests...</div>
    </div>

    <h2>Live Frontend Preview</h2>
    <iframe id="frontend-frame" src="http://localhost:3000" onload="testFrameContent()"></iframe>

    <script>
        const testContainer = document.getElementById('tests');
        const results = [];

        function addResult(test, status, message) {
            results.push({ test, status, message });
            updateDisplay();
        }

        function updateDisplay() {
            testContainer.innerHTML = results.map(r =>
                `<div class="test-result ${r.status}">
                    <strong>${r.test}:</strong> ${r.message}
                </div>`
            ).join('');
        }

        async function runTests() {
            // Test 1: Check if main page loads
            try {
                const response = await fetch('http://localhost:3000');
                const html = await response.text();

                if (html.includes('<div id="root">')) {
                    addResult('HTML Structure', 'pass', 'React root element found in HTML');
                } else {
                    addResult('HTML Structure', 'fail', 'No React root element found');
                }

                // Test 2: Check for React JavaScript bundle
                const jsMatch = html.match(/src="([^"]*main\.[^"]*\.js)"/);
                if (jsMatch) {
                    addResult('JavaScript Bundle', 'pass', `Found JS file: ${jsMatch[1]}`);

                    // Test 3: Try to load the JS bundle
                    try {
                        const jsResponse = await fetch(`http://localhost:3000${jsMatch[1]}`);
                        if (jsResponse.ok) {
                            const jsContent = await jsResponse.text();

                            if (jsContent.includes('React') || jsContent.includes('createElement')) {
                                addResult('React Content', 'pass', 'React code detected in bundle');
                            } else {
                                addResult('React Content', 'fail', 'No React code found in bundle');
                            }

                            if (jsContent.includes('DashboardOptimized')) {
                                addResult('Dashboard Component', 'pass', 'DashboardOptimized found in bundle');
                            } else {
                                addResult('Dashboard Component', 'fail', 'DashboardOptimized NOT found in bundle');
                            }
                        } else {
                            addResult('Bundle Access', 'fail', `Cannot load JS bundle: ${jsResponse.status}`);
                        }
                    } catch (error) {
                        addResult('Bundle Access', 'fail', `Error loading JS: ${error.message}`);
                    }
                } else {
                    addResult('JavaScript Bundle', 'fail', 'No main JS file found in HTML');
                }

            } catch (error) {
                addResult('Page Load', 'fail', `Cannot load main page: ${error.message}`);
            }

            // Test 4: CSS check
            try {
                const response = await fetch('http://localhost:3000');
                const html = await response.text();

                const cssMatch = html.match(/href="([^"]*\.css)"/);
                if (cssMatch) {
                    const cssResponse = await fetch(`http://localhost:3000${cssMatch[1]}`);
                    if (cssResponse.ok) {
                        addResult('CSS Assets', 'pass', 'CSS file loads successfully');
                    } else {
                        addResult('CSS Assets', 'warn', 'CSS file found but not loading');
                    }
                } else {
                    addResult('CSS Assets', 'warn', 'No CSS file reference found');
                }
            } catch (error) {
                addResult('CSS Assets', 'fail', `CSS test failed: ${error.message}`);
            }
        }

        function testFrameContent() {
            setTimeout(() => {
                try {
                    const iframe = document.getElementById('frontend-frame');
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const rootEl = iframeDoc.getElementById('root');

                    if (rootEl) {
                        const content = rootEl.innerHTML;
                        if (content && content.trim().length > 100) {
                            addResult('React Rendering', 'pass', `React app rendered (${content.length} chars in root)`);
                        } else if (content && content.trim().length > 0) {
                            addResult('React Rendering', 'warn', `Partial content in root (${content.length} chars)`);
                        } else {
                            addResult('React Rendering', 'fail', 'Root element is empty - React not mounting');
                        }
                    } else {
                        addResult('React Rendering', 'fail', 'No root element found in iframe');
                    }
                } catch (error) {
                    addResult('React Rendering', 'fail', `Cannot access iframe: ${error.message}`);
                }
            }, 3000); // Wait 3 seconds for React to mount
        }

        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
